    "fastembed>=0.9.1",
    "gradio>=6.30.0",
    "httpx>=0.28.1",
    "ipywidgets>=8.1.9",
    "jupyter>=1.1.1",
    "langchain-anthropic>=1.7.6",
    "langchain-core>=1.7.0",
